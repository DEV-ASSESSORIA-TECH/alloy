# Somente a versao do Grafana Alloy (alloy.Dockerfile). Um PR do Dependabot
# muda a versao que o alloyctl instala; a CI valida os .alloy com ela. Para
# chegar as maquinas: merge, release PATCH e [3] Atualizar Alloy em cada uma.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
